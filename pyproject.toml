[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "encomm-pipeline-control-center"
version = "0.7.0"
description = "Local Windows desktop supervisor for AI coding pipelines (v0.5: one-call final audit + next-batch handoff)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ENCOMM" }]
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
encomm-pcc = "encomm_pcc.app:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
encomm_pcc = ["persistence/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:encomm_pcc.*"]
